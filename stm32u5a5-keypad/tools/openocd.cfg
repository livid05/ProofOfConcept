# Proven clone ST-Link transport/settings from the working RevK bring-up.
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
set WORKAREASIZE 0x8000
set CHIPNAME STM32U5A5RJTx
set CLOCK_FREQ 100
set CONNECT_UNDER_RESET 0
set CORE_RESET 0
reset_config none
source [find target/stm32u5x.cfg]
adapter speed 100
